# emailctx configuration. Paths are relative to the directory this file is in.

db_path: emailctx.db

# One <Company>.md per company, written to every destination configured here.
# Each destination is written only when the rendered file's SHA-256 differs.
output:
  # Google Drive: "<root_folder>/<Company>/" holds <Company>.md, Emails/ (a .txt copy
  # of every email routed to the company) and Documents/ (their attachments).
  # Off: the database is the source of truth and the MCP server reads it directly.
  # Turn on to also publish each file, email copies and attachments to Google Drive.
  drive:
    enabled: false
    root_folder: Client Context
  local_dir: companies          # local copy of the .md files; null to disable
  git_commit: false             # commit each change in local_dir (its own git repo)
  s3:
    bucket: null                # set to also publish to s3://<bucket>/<prefix><company_id>/context.md
    prefix: ""
    region: null
    profile: null

google:
  # OAuth "Desktop app" client downloaded from Google Cloud Console (gitignored).
  client_secrets: client_secret.json
  # Gmail is read-only. drive.file lets the app manage only the folders and files it
  # creates itself, nothing else in your Drive. Any other scope is refused.
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    # - https://www.googleapis.com/auth/drive.file   # re-enable with output.drive.enabled
  # The refresh token is kept in the OS keyring (Windows Credential Manager, macOS
  # Keychain, Secret Service), never in a file or in logs.

gmail:
  # Gmail search for tracked mail. null = built from the registry: mail from/to/cc any
  # company domain or contact, subject keywords, and meeting bots. Set it to e.g.
  # "label:clients" to also discover new clients (unknown domains go to review).
  query: null
  backfill_max: 200             # cap for a plain backfill (used when Drive is off)
  poll_minutes: 0               # `emailctx serve` checks Gmail every N minutes; 0 = off

# A company with no .md in its Drive folder gets one built from this much past mail.
bootstrap:
  days: 100
  max_per_company: 500

# LLM provider: anthropic (needs ANTHROPIC_API_KEY) or gemini (needs GEMINI_API_KEY).
# Model names below must belong to the chosen provider.
provider: gemini

models:
  # Tested 2026-11-22: the -preview names are gone (404); 3.7/3.8-flash returned 503
  # (overloaded) and gemini-4-* 429 (no quota on this key).
  gate: gemini-3.5-flash-lite      # cheap relevance check
  extract: gemini-3.6-flash        # JSON ops
  judge: gemini-3.5-flash-lite     # reword / duplicate check
  # Anthropic: gate/judge claude-haiku-5-5, extract claude-opus-5-5

effort:
  gate: low
  extract: high
  judge: low

max_tokens:
  gate: 1024
  extract: 16000
  judge: 1024

# Server-side refusal fallback ("default" lets the API pick the fallback model).
# null disables it; Haiku has no server-side fallback.
fallbacks:
  gate: null
  extract: default
  judge: null

routing:
  # Free mail providers say nothing about the company. Addresses on them match only
  # through company_contacts (full address).
  personal_providers:
    - gmail.com
    - googlemail.com
    - outlook.com
    - hotmail.com
    - live.com
    - msn.com
    - yahoo.com
    - icloud.com
    - me.com
    - aol.com
    - proton.me
    - protonmail.com
  # Meeting-summary bots. Their domain says nothing about the client, so their emails
  # are matched on company/project names (subject, body, attachment names).
  meeting_bot_domains:
    - fireflies.ai
    - otter.ai
    - fathom.video
    - read.ai
    - tldv.io
    - meetgeek.ai
    - avoma.com
    - gong.io
    - grain.com
    - krisp.ai
    - tactiq.io
  # Trust an external sender's domain only when Authentication-Results shows dmarc=pass.
  require_dmarc_pass: false

pipeline:
  max_extract_retries: 1      # validate can send rejected ops back to extract this many times
  min_evidence_chars: 5       # normalized evidence shorter than this is rejected
  judge_top_k: 20             # candidates the duplicate judge sees
  max_attachment_chars: 100000  # attachment text (PDFs etc.) read per email

# Fixed category set. Anything else the LLM returns is mapped to "other".
# Order here is the section order in context.md.
categories:
  - functional
  - non-functional
  - data
  - integration
  - ui
  - constraint
  - other
