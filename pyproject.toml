[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emailctx"
version = "0.1.0"
description = "Route emails to projects and maintain one cited requirements file per project."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "google-genai>=1.51",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6",
    "langgraph>=0.2",
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
    "tldextract>=5",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.2",
    "keyring>=24",
    "pypdf>=4",
    "mcp>=2.3",
]

[project.optional-dependencies]
# Phase 4: sentence-transformers plugs into the Embedder interface.
embeddings = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[project.scripts]
emailctx = "emailctx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emailctx = ["render/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
